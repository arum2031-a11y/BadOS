<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT API HTML Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    textarea, input, button { width: 100%; box-sizing: border-box; margin-top: 0.5rem; }
    textarea { min-height: 120px; }
    #output { white-space: pre-wrap; border: 1px solid #ddd; padding: 1rem; border-radius: 8px; min-height: 120px; margin-top: 1rem; }
    .note { font-size: 0.9rem; color: #b45309; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>ChatGPT API HTML Demo</h1>

  <label for="apiKey">OpenAI API Key</label>
  <input id="apiKey" type="password" placeholder="sk-..." />

  <label for="prompt">Prompt</label>
  <textarea id="prompt" placeholder="Ask something..."></textarea>

  <button id="sendBtn">Send</button>

  <div class="note">
    Warning: Putting API keys directly in front-end code is not safe for production.
    Use a backend proxy for real apps.
  </div>

  <h2>Response</h2>
  <div id="output">(response will appear here)</div>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const apiKeyInput = document.getElementById('apiKey');
    const promptInput = document.getElementById('prompt');
    const output = document.getElementById('output');

    async function callChatGPT() {
      const apiKey = apiKeyInput.value.trim();
      const prompt = promptInput.value.trim();

      if (!apiKey || !prompt) {
        output.textContent = 'Please enter both API key and prompt.';
        return;
      }

      sendBtn.disabled = true;
      output.textContent = 'Loading...';

      try {
        const response = await fetch('https://api.openai.com/v1/responses', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-4.1-mini',
            input: prompt
          })
        });

        const data = await response.json();

        if (!response.ok) {
          output.textContent = data.error?.message || 'Request failed.';
          return;
        }

        // Common place for text output in Responses API
        const text = data.output_text || '(No text output returned.)';
        output.textContent = text;
      } catch (err) {
        output.textContent = `Error: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', callChatGPT);
  </script>
</body>
</html>
