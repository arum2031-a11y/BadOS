<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPN Connection</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a31;
      --border: #263350;
      --text: #e6edf7;
      --muted: #9fb0d1;
      --green: #22c55e;
      --green-d: #14532d;
      --red: #ef4444;
      --red-d: #7f1d1d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #141f3c 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 1rem;
    }

    .card {
      width: min(460px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(159, 176, 209, 0.15);
      gap: 1rem;
    }

    .row:last-of-type { border-bottom: none; }

    .label { color: var(--muted); }

    .value {
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }

    .status {
      margin-top: 0.85rem;
      padding: 0.7rem;
      border-radius: 10px;
      font-weight: 700;
      text-align: center;
    }

    .connected {
      background: color-mix(in srgb, var(--green-d) 72%, transparent);
      border: 1px solid color-mix(in srgb, var(--green) 40%, #000);
      color: #b9f8cf;
    }

    .disconnected {
      background: color-mix(in srgb, var(--red-d) 72%, transparent);
      border: 1px solid color-mix(in srgb, var(--red) 45%, #000);
      color: #fecaca;
    }

    .controls {
      margin-top: 0.9rem;
      display: grid;
      gap: 0.5rem;
      grid-template-columns: 1fr 1fr;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    #connectBtn {
      background: var(--green);
      color: #052e16;
    }

    #disconnectBtn {
      background: var(--red);
      color: #fff;
    }

    .note {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>VPN Status</h1>

    <div class="row">
      <span class="label">Device</span>
      <span class="value">Home MacBook</span>
    </div>
    <div class="row">
      <span class="label">Tunnel Name</span>
      <span class="value">Home-Mac-Secure</span>
    </div>
    <div class="row">
      <span class="label">Protocol</span>
      <span class="value">WireGuard</span>
    </div>
    <div class="row">
      <span class="label">Assigned IP</span>
      <span id="ipValue" class="value">10.0.8.2</span>
    </div>

    <div id="statusBox" class="status disconnected">Disconnected</div>

    <div class="controls">
      <button id="connectBtn" type="button">Connect</button>
      <button id="disconnectBtn" type="button">Disconnect</button>
    </div>

    <p class="note">This is a visual HTML mock of VPN status UI, not a real VPN client.</p>
  </main>

  <script>
    const statusBox = document.getElementById('statusBox');
    const ipValue = document.getElementById('ipValue');

    document.getElementById('connectBtn').addEventListener('click', () => {
      statusBox.textContent = 'Connected to Home MacBook';
      statusBox.className = 'status connected';
      ipValue.textContent = '10.0.8.2';
    });

    document.getElementById('disconnectBtn').addEventListener('click', () => {
      statusBox.textContent = 'Disconnected';
      statusBox.className = 'status disconnected';
      ipValue.textContent = '—';
    });
  </script>
</body>
</html>
